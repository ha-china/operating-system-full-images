name: Build single channel images

on:
  workflow_dispatch:
    inputs:
      board:
        description: Select board to build
        required: true
        default: all
        type: choice
        options:
          - all
          - generic-aarch64
          - generic-x86-64
          - green
          - ova
          - orangepi-cm4
          - panther-x2
          - rpi3-64
          - rpi4-64
          - rpi5-64
          - yellow

permissions: {}

jobs:
  resolve-matrix:
    name: Resolve build matrix for channel stable
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Download channel version metadata
        env:
          CHANNEL: stable
        run: |
          curl -fsSL "https://version.hasscn.top/${CHANNEL}.json" -o "version-${CHANNEL}.json"

      - name: Compute release metadata
        id: release
        env:
          CHANNEL: stable
          VERSION_FILE: version-stable.json
        run: |
          release_version=$(jq -r '[.hassos | to_entries[] | .value] | unique | join("+")' "$VERSION_FILE")

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_version}" >> "$GITHUB_OUTPUT"

          if [ "$CHANNEL" = "stable" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve boards and source image URLs
        id: matrix
        env:
          CHANNEL: stable
          SELECTED_BOARD: ${{ inputs.board }}
        run: |
          echo "::group::Generate build matrix for channel=${CHANNEL}"
          version_file="version-${CHANNEL}.json"

          matrix_json="$(jq -c --arg release_repo "ha-china/HAOS-CN" --arg selected_board "$SELECTED_BOARD" '
            [
              .hassos                                     # Board -> HAOS version map
              | to_entries[]                              # Iterate board/version pairs
              | .key as $board
              | .value as $version
              | select((($board | startswith("odroid-")) or ($board | startswith("khadas-")) or ($board == "ihost")) | not)
              | select($selected_board == "all" or $board == $selected_board)
              | (
                  if $board == "ova"
                  then "https://github.com/\($release_repo)/releases/download/\($version)/haos_\($board)-\($version).qcow2.xz"
                  else "https://github.com/\($release_repo)/releases/download/\($version)/haos_\($board)-\($version).img.xz"
                  end
                ) as $image_url
              | {                                       # Format matrix entry
                  board: $board,
                  version: $version,
                  image_url: $image_url,
                  filename: ($image_url | split("/") | last)
                }
            ]
            | sort_by(.board)
          ' "$version_file")"

          {
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Print resolved build matrix"
          jq . <<< "$matrix_json"
          echo "::endgroup::"

  create-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions: {}
    steps:
      - name: Print release metadata
        env:
          RELEASE_TAG: ${{ needs.resolve-matrix.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-matrix.outputs.release_version }}
        run: |
          echo "Release tag: ${RELEASE_TAG}"
          echo "Release version: ${RELEASE_VERSION}"

  build:
    name: Build images for ${{ matrix.board }} version ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - resolve-matrix
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout private repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Free disk space
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          chmod +x private/*.sh
          sudo private/release_space.sh
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Download HAOS input image
        run: |
          mkdir -p input
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
            -o "input/${{ matrix.filename }}" \
            "${{ matrix.image_url }}"

      - name: Build full image
        run: |
          make docker-image
          make build IMAGE="${{ matrix.filename }}" CHANNEL="stable"

      - name: Detect output formats
        id: formats
        run: |
          prefix="output/haos_${{ matrix.board }}-${{ matrix.version }}-full"
          found=0
          for ext in img.xz qcow2.xz vmdk.zip vdi.zip vhdx.zip ova; do
            key="${ext%%.*}"
            if [ -f "${prefix}.${ext}" ]; then
              echo "has_${key}=true" >> "$GITHUB_OUTPUT"
              echo "Found: ${prefix}.${ext}"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No output files found matching ${prefix}.*"
            ls -la output/ || true
            exit 1
          fi

      - name: Upload successful outputs to GitHub release
        uses: svenstaro/upload-release-action@v2
        if: success()
        with:
          repo_name: ha-china/HAOS-CN
          repo_token: ${{ secrets.GH_PAT }}
          file: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.*
          file_glob: true
          tag: ${{ needs.resolve-matrix.outputs.release_tag }}
          prerelease: false
          overwrite: true
          make_latest: true
