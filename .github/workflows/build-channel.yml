name: Build single channel images

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Home Assistant release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - dev

permissions: {}

jobs:
  resolve-matrix:
    name: Resolve build matrix for channel ${{ inputs.channel }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build_date: ${{ steps.date.outputs.build_date }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Compute UTC build date
        id: date
        run: echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download channel version metadata
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          curl -fsSL "https://version.hasscn.top/${CHANNEL}.json" -o "version-${CHANNEL}.json"

      - name: Compute release metadata
        id: release
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_FILE: version-${{ inputs.channel }}.json
        run: |
          release_version=$(jq -r '[.hassos | to_entries[] | .value] | unique | join("+")' "$VERSION_FILE")

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${CHANNEL}-${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_name=HAOS ${CHANNEL} full images - ${release_version}" >> "$GITHUB_OUTPUT"

          if [ "$CHANNEL" = "stable" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve boards and source image URLs
        id: matrix
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "::group::Generate build matrix for channel=${CHANNEL}"
          version_file="version-${CHANNEL}.json"

          matrix_json="$(jq -c --arg os_name "haos" '
            [
              . as $root                                  # Keep full payload for .ota template
              | .hassos                                   # Board -> HAOS version map
              | to_entries[]                              # Iterate board/version pairs
              | .key as $board
              | .value as $version
              | select((($board | startswith("odroid-")) or ($board | startswith("khadas-"))) | not)
              | (                                       # Get image URL from ota template, replacing placeholders
                  $root.ota
                  | gsub("\\{os_name\\}"; $os_name)     # Replace {os_name}
                  | gsub("\\{board\\}"; $board)         # Replace {board} by entry key
                  | gsub("\\{version\\}"; $version)     # Replace {version} by entry value
                  | if $board == "ova"                  # Change OTA filename suffix to appropriate image suffix
                    then gsub("raucb$"; "qcow2.xz")
                    else gsub("raucb$"; "img.xz")
                    end
                ) as $image_url
              | {                                       # Format matrix entry
                  board: $board,
                  version: $version,
                  image_url: $image_url,
                  filename: ($image_url | split("/") | last)
                }
            ]
            | sort_by(.board)
          ' "$version_file")"

          {
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Print resolved build matrix"
          jq . <<< "$matrix_json"
          echo "::endgroup::"

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-matrix.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.resolve-matrix.outputs.release_name }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ needs.resolve-matrix.outputs.release_version }}
          BUILD_DATE: ${{ needs.resolve-matrix.outputs.build_date }}
          PRERELEASE: ${{ needs.resolve-matrix.outputs.prerelease }}
        run: |
          prerelease_args=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi

          cat > release-notes.txt <<EOF
          Channel: $CHANNEL
          Version: $RELEASE_VERSION
          Build date (UTC): $BUILD_DATE

          Automated build for Home Assistant OS full images.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.txt \
              "${prerelease_args[@]}"

            asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            if [ -n "$asset_names" ]; then
              while IFS= read -r asset_name; do
                [ -n "$asset_name" ] || continue
                gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
              done <<< "$asset_names"
            fi
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.txt \
              "${prerelease_args[@]}"
          fi

  build:
    name: Build images for ${{ matrix.board }} version ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - resolve-matrix
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout private repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Free disk space
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          chmod +x private/*.sh
          sudo private/release_space.sh
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Download HAOS input image
        run: |
          mkdir -p input
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
            -o "input/${{ matrix.filename }}" \
            "${{ matrix.image_url }}"

      - name: Build full image
        run: |
          make docker-image
          make build IMAGE="${{ matrix.filename }}" CHANNEL="${{ inputs.channel }}"

      - name: Append UTC date suffix to outputs
        env:
          BUILD_DATE: ${{ needs.resolve-matrix.outputs.build_date }}
        run: |
          shopt -s nullglob

          found=0
          for src in output/haos_${{ matrix.board }}-${{ matrix.version }}-full*; do
            found=1
            base="$(basename "$src")"
            dst="${base/-full/-full-${BUILD_DATE}}"
            mv "$src" "output/$dst"
          done

          if [ "$found" -ne 1 ]; then
            echo "No outputs found for board=${{ matrix.board }} version=${{ matrix.version }}" >&2
            ls -la output || true
            exit 1
          fi

          ls -lh output

      - name: Detect output formats
        id: formats
        env:
          BUILD_DATE: ${{ needs.resolve-matrix.outputs.build_date }}
        run: |
          prefix="output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${BUILD_DATE}"
          found=0
          for ext in img.xz qcow2.xz vmdk.zip vdi.zip vhdx.zip ova; do
            key="${ext%%.*}"
            if [ -f "${prefix}.${ext}" ]; then
              echo "has_${key}=true" >> "$GITHUB_OUTPUT"
              echo "Found: ${prefix}.${ext}"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No output files found matching ${prefix}.*"
            ls -la output/ || true
            exit 1
          fi

      - name: Upload raw image
        if: steps.formats.outputs.has_img == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}.img.xz
          if-no-files-found: error

      - name: Upload QCOW2 image
        if: steps.formats.outputs.has_qcow2 == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}.qcow2.xz
          if-no-files-found: error

      - name: Upload VMDK image
        if: steps.formats.outputs.has_vmdk == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}.vmdk.zip
          if-no-files-found: error

      - name: Upload VDI image
        if: steps.formats.outputs.has_vdi == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}.vdi.zip
          if-no-files-found: error

      - name: Upload VHDX image
        if: steps.formats.outputs.has_vhdx == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}.vhdx.zip
          if-no-files-found: error

      - name: Upload OVA image
        if: steps.formats.outputs.has_ova == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${{ needs.resolve-matrix.outputs.build_date }}.ova
          if-no-files-found: error

      - name: Upload successful outputs to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-matrix.outputs.release_tag }}
          BUILD_DATE: ${{ needs.resolve-matrix.outputs.build_date }}
        run: |
          shopt -s nullglob
          assets=(output/haos_${{ matrix.board }}-${{ matrix.version }}-full-${BUILD_DATE}.*)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found for board=${{ matrix.board }} version=${{ matrix.version }}"
            exit 0
          fi

          ls -lh "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
