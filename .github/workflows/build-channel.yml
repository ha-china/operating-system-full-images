name: Build single channel images

on:
  workflow_dispatch:

permissions: {}

jobs:
  resolve-matrix:
    name: Resolve build matrix for channel stable
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Download channel version metadata
        env:
          CHANNEL: stable
        run: |
          curl -fsSL "https://version.hasscn.top/${CHANNEL}.json" -o "version-${CHANNEL}.json"

      - name: Compute release metadata
        id: release
        env:
          CHANNEL: stable
          VERSION_FILE: version-stable.json
        run: |
          release_version=$(jq -r '[.hassos | to_entries[] | .value] | unique | join("+")' "$VERSION_FILE")

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_version}" >> "$GITHUB_OUTPUT"

          if [ "$CHANNEL" = "stable" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve boards and source image URLs
        id: matrix
        env:
          CHANNEL: stable
        run: |
          echo "::group::Generate build matrix for channel=${CHANNEL}"
          version_file="version-${CHANNEL}.json"

          matrix_json="$(jq -c --arg release_repo "ha-china/HAOS-CN" '
            [
              .hassos                                     # Board -> HAOS version map
              | to_entries[]                              # Iterate board/version pairs
              | .key as $board
              | .value as $version
              | select((($board | startswith("odroid-")) or ($board | startswith("khadas-"))) | not)
              | (
                  if $board == "ova"
                  then "https://github.com/\($release_repo)/releases/download/\($version)/haos_\($board)-\($version).qcow2.xz"
                  else "https://github.com/\($release_repo)/releases/download/\($version)/haos_\($board)-\($version).img.xz"
                  end
                ) as $image_url
              | {                                       # Format matrix entry
                  board: $board,
                  version: $version,
                  image_url: $image_url,
                  filename: ($image_url | split("/") | last)
                }
            ]
            | sort_by(.board)
          ' "$version_file")"

          {
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Print resolved build matrix"
          jq . <<< "$matrix_json"
          echo "::endgroup::"

  create-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions: {}
    steps:
      - name: Print release metadata
        env:
          RELEASE_TAG: ${{ needs.resolve-matrix.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.resolve-matrix.outputs.release_name }}
          RELEASE_VERSION: ${{ needs.resolve-matrix.outputs.release_version }}
        run: |
          echo "Release tag: ${RELEASE_TAG}"
          echo "Release name: ${RELEASE_NAME}"
          echo "Release version: ${RELEASE_VERSION}"

  build:
    name: Build images for ${{ matrix.board }} version ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - resolve-matrix
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout private repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Free disk space
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          chmod +x private/*.sh
          sudo private/release_space.sh
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Download HAOS input image
        run: |
          mkdir -p input
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
            -o "input/${{ matrix.filename }}" \
            "${{ matrix.image_url }}"

      - name: Build full image
        run: |
          make docker-image
          make build IMAGE="${{ matrix.filename }}" CHANNEL="stable"

      - name: Detect output formats
        id: formats
        run: |
          prefix="output/haos_${{ matrix.board }}-${{ matrix.version }}-full"
          found=0
          for ext in img.xz qcow2.xz vmdk.zip vdi.zip vhdx.zip ova; do
            key="${ext%%.*}"
            if [ -f "${prefix}.${ext}" ]; then
              echo "has_${key}=true" >> "$GITHUB_OUTPUT"
              echo "Found: ${prefix}.${ext}"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No output files found matching ${prefix}.*"
            ls -la output/ || true
            exit 1
          fi

      - name: Upload raw image
        if: steps.formats.outputs.has_img == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.img.xz
          if-no-files-found: error

      - name: Upload QCOW2 image
        if: steps.formats.outputs.has_qcow2 == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.qcow2.xz
          if-no-files-found: error

      - name: Upload VMDK image
        if: steps.formats.outputs.has_vmdk == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.vmdk.zip
          if-no-files-found: error

      - name: Upload VDI image
        if: steps.formats.outputs.has_vdi == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.vdi.zip
          if-no-files-found: error

      - name: Upload VHDX image
        if: steps.formats.outputs.has_vhdx == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.vhdx.zip
          if-no-files-found: error

      - name: Upload OVA image
        if: steps.formats.outputs.has_ova == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          archive: false
          name: haos-${{ matrix.board }}-${{ matrix.version }}-full
          path: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.ova
          if-no-files-found: error

      - name: Upload successful outputs to GitHub release
        uses: svenstaro/upload-release-action@v2
        if: success()
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/haos_${{ matrix.board }}-${{ matrix.version }}-full.*
          file_glob: true
          tag: ${{ needs.resolve-matrix.outputs.release_tag }}
          release_name: ${{ needs.resolve-matrix.outputs.release_name }}
          body: |
            Channel: stable
            Version: ${{ needs.resolve-matrix.outputs.release_version }}
            Automated build for Home Assistant OS full images.
          prerelease: false
          overwrite: true
          make_latest: true
